name: Ziff Davis Enterprise
description: >-
  Ziff Davis (Nasdaq: ZD) is a vertically focused digital media and internet company whose
  portfolio includes leading brands across technology, entertainment, shopping, health,
  cybersecurity, and marketing technology. Its brands include PCMag, Mashable, IGN, Lifehacker,
  RetailMeNot, Spiceworks, Everyday Health, IPVanish, Ookla (Speedtest), FullContact, and
  iContact, among others. The company operates a portfolio of advertising, subscription, and
  performance-marketing businesses rather than a single first-party public API product. This
  API Evangelist profile was surfaced as an Insight Partners portfolio lead; a public web
  crawl of the corporate site found an active investor-relations, newsroom, brands, privacy,
  and terms surface but no developer portal, API reference, or published API specification at
  the corporate (ziffdavis.com) level.
