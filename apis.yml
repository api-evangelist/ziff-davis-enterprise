aid: ziff-davis-enterprise
name: Ziff Davis Enterprise
description: >-
  Ziff Davis (Nasdaq: ZD) is a vertically focused digital media and internet company whose
  portfolio includes leading brands across technology, entertainment, shopping, health,
  cybersecurity, and marketing technology. Its brands include PCMag, Mashable, IGN, Lifehacker,
  RetailMeNot, Spiceworks, Everyday Health, IPVanish, Ookla (Speedtest), FullContact, and
  iContact, among others. The company operates a portfolio of advertising, subscription, and
  performance-marketing businesses rather than a single first-party public API product. This
  API Evangelist profile was surfaced as an Insight Partners portfolio lead; a public web
  crawl of the corporate site found an active investor-relations, newsroom, brands, privacy,
  and terms surface but no developer portal, API reference, or published API specification at
  the corporate (ziffdavis.com) level. A second enrichment pass on 2026-08-13 ran full
  contract discovery against www.ziffdavis.com — OpenAPI, Swagger, GraphQL, MCP, llms.txt and
  every /.well-known/ path returned 404, and the WordPress REST root returned 401 — confirming
  the absence, while surfacing three real corporate programs: a Bugcrowd-hosted Responsible
  Vulnerability Disclosure Program, a published data-protection compliance program (Data
  Privacy Framework self-certification for 32 named group entities, GDPR DPAs, CCPA request
  metrics, EU DSA statement, NIST SP 800-88 vendor security exhibit), and five first-party
  PHP packages in the ziffdavis Packagist namespace — none of which is an API client library.
  Ziff Davis brands with their own API surfaces are profiled as separate entries.
