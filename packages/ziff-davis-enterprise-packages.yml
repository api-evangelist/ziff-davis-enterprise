notes: >-
  IMPORTANT — none of these is an API client SDK. Ziff Davis, Inc. publishes no API at
  the corporate level, so there is nothing for a client library to wrap. What the
  ZiffDavis GitHub organization (17 public repos, verified org, github.com/ZiffDavis)
  and the `ziffdavis` Packagist vendor namespace actually ship is internal
  engineering utilities: Laravel/Nova field packages, a OneLogin SSO integration, and
  a Base62 UUID encoder. They are genuinely first-party (published under the company's
  own org and vendor namespace), so `official: true` is correct, but NO `SDKs` pointer
  is emitted in apis.yml — `sdk_count` asks how many client libraries a provider ships
  for its API, and the honest answer here is zero. Versions and dates are read from the
  Packagist metadata endpoint. Every one of the five published packages is stale: four
  last released in 2019–2020, one in 2023.
